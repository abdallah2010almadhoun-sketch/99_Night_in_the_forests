<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>99 Nights</title>
    <meta name="description" content="99 Nights - low-poly survival in a dark forest" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="panel left">
        <div class="label">NIGHT</div>
        <div id="nightText" class="value">1</div>
      </div>
      <div class="panel center">
        <div id="statusText" class="status">Campfire holds</div>
      </div>
      <div class="panel right">
        <div class="label">HEALTH</div>
        <div id="healthText" class="value">100</div>
      </div>
    </div>

    <div id="joystickZone" aria-label="Move joystick">
      <div id="joystickBase">
        <div id="joystickKnob"></div>
      </div>
    </div>

    <button id="attackBtn" aria-label="Swing your lantern">STRIKE <span>SPACE</span></button>
    <div id="desktopHelp" aria-hidden="true">WASD / ARROWS · DRAG TO LOOK · SPACE TO STRIKE</div>
    <div id="lookZone" aria-label="Look around"></div>

    <div id="startOverlay" class="overlay visible">
      <div class="title">99 Nights</div>
      <div class="subtitle">Survive the dark. Protect the campfire.</div>
      <div class="hint">Move with the left pad. Drag on the right to look.</div>
      <button id="startBtn">Begin</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
